# Local dev overlay — postgres + redis untuk `ENVIRONMENT=development`
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manhwa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/manhwa
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - MONITOR_AUTH_TOKEN=dev
      - AUTH_SECRET=dev-secret-dev-secret-dev-secret-32chars!!
      - CRON_SECRET=dev
      - DISCORD_BOT_TOKEN=dev
      - DISCORD_PUBLIC_KEY=dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    environment:
      - BACKEND_URL=http://backend:8000
      - API_TOKEN=dev

volumes:
  pgdata:
