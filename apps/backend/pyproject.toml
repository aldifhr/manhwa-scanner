[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Block broad bare excepts and blind exception swallows going forward.
# Existing scrapers use `except Exception: pass` intentionally (network noise),
# but new code should log or handle specifically.
select = ["E", "F", "B", "E722"]   # E722 = bare except
ignore = ["E501", "B008"]          # long lines, fastapi endpoint decorator

[tool.ruff.lint.per-file-ignores]
# Scrapers legitimately swallow network errors — narrow to B904 (try/except without logging)
"app/scrapers/*" = ["B904"]
"app/cron/*" = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-fail-under=40"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests"]
