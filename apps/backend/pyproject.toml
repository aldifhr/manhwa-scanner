[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Block broad bare excepts and blind exception swallows going forward.
# Existing scrapers use `except Exception: pass` intentionally (network noise),
# but new code should log or handle specifically.
select = ["E", "F", "B", "E722"]   # E722 = bare except
ignore = ["E501", "B008"]          # long lines, fastapi endpoint decorator

[tool.ruff.lint.per-file-ignores]
# Scrapers legitimately swallow network errors
"app/scrapers/*" = ["B"]
"app/cron/*" = ["B"]
